server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — fall back to index.html for all non-asset paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Forward /api calls to the transaction service
    location /api/ {
        proxy_pass http://transaction-service:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
